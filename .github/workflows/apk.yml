name: Fabricar APK

# Se fabrica sola cuando cambias version.js (o la parte Android).
# También se puede lanzar a mano: pestaña Actions → Fabricar APK → Run workflow.
on:
  push:
    branches: [main]
    paths:
      - "version.js"
      - "native/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Leer la versión
        id: v
        run: echo "version=$(node -e "global.self={};require('./version.js');console.log(self.AVZ_VERSION)")" >> "$GITHUB_OUTPUT"

      - name: Preparar el proyecto
        run: |
          npm install --no-audit --no-fund
          node native/prepare.js web
          npx cap add android
          node native/prepare.js android "${{ steps.v.outputs.version }}"
          npx cap sync android

      - name: Compilar el APK
        env:
          AVZ_KS_PASS: ${{ secrets.AVZ_KS_PASS }}
        run: |
          if [ -z "$AVZ_KS_PASS" ]; then
            echo "::error::Falta el secreto AVZ_KS_PASS (Settings → Secrets and variables → Actions). Mira el README."
            exit 1
          fi
          export AVZ_KEYSTORE="$GITHUB_WORKSPACE/native/avzonazul.keystore"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/AVZonazul.apk"

      - name: Publicar la versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: AVZonazul ${{ steps.v.outputs.version }}
          files: AVZonazul.apk
          make_latest: true
          body: |
            AVZonazul ${{ steps.v.outputs.version }} para Android.
            Descarga **AVZonazul.apk** e instálalo. Si ya tienes la app, se actualizará sola desde dentro.
